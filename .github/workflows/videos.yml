name: Atualizar vídeos do Futsal Douro
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade yt-dlp
      - run: python scripts/atualizar_videos.py
      - name: Guardar lista atualizada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar vídeos do YouTube'
            git push
          fi

